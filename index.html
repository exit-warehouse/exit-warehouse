<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111111">

  <meta name="description"
        content="EXIT Warehouse Inventory">

  <link rel="manifest" href="manifest.json">

  <title>EXIT Warehouse Inventory</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111111;
      color: white;
      padding: 20px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: #bbbbbb;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .card-number {
      font-size: 30px;
      font-weight: bold;
    }

    .stock {
      border-left: 5px solid #2563eb;
    }

    .in {
      border-left: 5px solid #16a34a;
    }

    .out {
      border-left: 5px solid #dc2626;
    }

    .low {
      border-left: 5px solid #f59e0b;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-in {
      background: #16a34a;
    }

    .btn-out {
      background: #dc2626;
    }

    .refresh {
      background: #2563eb;
      width: 100%;
      margin-top: 10px;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 11px 9px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-in {
      background: #dcfce7;
      color: #166534;
    }

    .badge-out {
      background: #fee2e2;
      color: #991b1b;
    }

    .low-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .low-list li {
      padding: 12px;
      margin-bottom: 8px;
      background: #fff7ed;
      border-left: 4px solid #f59e0b;
      border-radius: 7px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    @media (min-width: 700px) {
      .cards {
        grid-template-columns: repeat(4, 1fr);
      }

      .buttons {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>EXIT Warehouse</h1>
  <p>Inventory Management System</p>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="cards">

    <div class="card stock">
      <div class="card-title">📦 Total Stock</div>
      <div class="card-number" id="totalStock">0</div>
    </div>

    <div class="card in">
      <div class="card-title">🟢 Stock In</div>
      <div class="card-number" id="totalIn">0</div>
    </div>

    <div class="card out">
      <div class="card-title">🔴 Stock Out</div>
      <div class="card-number" id="totalOut">0</div>
    </div>

    <div class="card low">
      <div class="card-title">⚠️ Low Stock</div>
      <div class="card-number" id="lowStockCount">0</div>
    </div>

  </div>


  <!-- STOCK MOVEMENT -->
  <div class="panel">

    <h2>Stock Movement</h2>

    <label for="product">Product</label>

    <select id="product">
      <option value="">Loading products...</option>
    </select>

    <label for="quantity">Quantity</label>

    <input
      id="quantity"
      type="number"
      min="1"
      step="1"
      placeholder="Enter quantity"
    >

    <div class="buttons">

      <button
        class="btn-in"
        onclick="stockIn()">
        ➕ Stock In
      </button>

      <button
        class="btn-out"
        onclick="stockOut()">
        ➖ Stock Out
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>


  <!-- LOW STOCK -->
  <div class="panel">

    <h2>⚠️ Low Stock Alert</h2>

    <div id="lowStockList">
      <div class="loading">Loading...</div>
    </div>

  </div>


  <!-- PRODUCTS -->
  <div class="panel">

    <h2>📦 Current Stock</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Product</th>
            <th>Code</th>
            <th>Unit</th>
            <th>Stock</th>
            <th>Minimum</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="productsTable">
        </tbody>

      </table>

    </div>

  </div>


  <!-- STOCK OUT HISTORY -->
  <div class="panel">

    <h2>📜 Stock Out History</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Stock After</th>
          </tr>
        </thead>

        <tbody id="historyTable">
        </tbody>

      </table>

    </div>

  </div>


  <button
    class="refresh"
    onclick="loadEverything()">
    🔄 Refresh Data
  </button>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================================
     SUPABASE CONNECTION
     ========================================= */

  const SUPABASE_URL =
    "https://ctucsrwfqlbscbfkmxyh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_OE0S0YBMDtb1HZ9NHQCudw_ZE1X74e4";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let products = [];


  /* =========================================
     STATUS MESSAGE
     ========================================= */

  function showStatus(message, type) {

    const box = document.getElementById("status");

    box.textContent = message;

    box.className = "status " + type;

    setTimeout(() => {
      box.className = "status";
    }, 5000);
  }


  /* =========================================
     LOAD EVERYTHING
     ========================================= */

  async function loadEverything() {

    await loadProducts();

    await loadTransactions();

  }


  /* =========================================
     LOAD PRODUCTS
     ========================================= */

  async function loadProducts() {

    const { data, error } = await db
      .from("products")
      .select("*")
      .order("id", { ascending: true });

    if (error) {

      console.error(error);

      showStatus(
        "Could not load products: " + error.message,
        "error"
      );

      return;
    }

    products = data || [];

    renderProductSelect();

    renderProducts();

    updateDashboard();

    renderLowStock();

  }


  /* =========================================
     PRODUCT SELECT
     ========================================= */

  function renderProductSelect() {

    const select =
      document.getElementById("product");

    select.innerHTML =
      '<option value="">Select product</option>';

    products.forEach(product => {

      const option =
        document.createElement("option");

      option.value = product.id;

      option.textContent =
        product.name +
        " — Stock: " +
        Number(product.qty || 0);

      select.appendChild(option);

    });

  }


  /* =========================================
     PRODUCTS TABLE
     ========================================= */

  function renderProducts() {

    const table =
      document.getElementById("productsTable");

    table.innerHTML = "";

    if (products.length === 0) {

      table.innerHTML =
        '<tr><td colspan="6" class="empty">No products found</td></tr>';

      return;
    }

    products.forEach(product => {

      const qty =
        Number(product.qty || 0);

      const min =
        Number(product.min || 0);

      let status = "";

      if (qty <= min) {

        status =
          '<span class="badge badge-out">LOW STOCK</span>';

      } else {

        status =
          '<span class="badge badge-in">OK</span>';

      }

      const row =
        document.createElement("tr");

      row.innerHTML = `

        <td>${escapeHtml(product.name || "")}</td>

        <td>${escapeHtml(product.code || "")}</td>

        <td>${escapeHtml(product.unit || "")}</td>

        <td><strong>${qty}</strong></td>

        <td>${min}</td>

        <td>${status}</td>

      `;

      table.appendChild(row);

    });

  }


  /* =========================================
     DASHBOARD
     ========================================= */

  function updateDashboard() {

    let total = 0;

    let low = 0;

    products.forEach(product => {

      const qty =
        Number(product.qty || 0);

      const min =
        Number(product.min || 0);

      total += qty;

      if (qty <= min) {
        low++;
      }

    });

    document.getElementById("totalStock")
      .textContent = total;

    document.getElementById("lowStockCount")
      .textContent = low;

  }


  /* =========================================
     LOW STOCK
     ========================================= */

  function renderLowStock() {

    const box =
      document.getElementById("lowStockList");

    const lowProducts =
      products.filter(product =>
        Number(product.qty || 0) <=
        Number(product.min || 0)
      );

    if (lowProducts.length === 0) {

      box.innerHTML =
        '<div class="empty">✅ No low-stock products</div>';

      return;
    }

    const list =
      document.createElement("ul");

    list.className = "low-list";

    lowProducts.forEach(product => {

      const li =
        document.createElement("li");

      li.innerHTML =
        "<strong>" +
        escapeHtml(product.name || "") +
        "</strong><br>" +
        "Current stock: " +
        Number(product.qty || 0) +
        " | Minimum: " +
        Number(product.min || 0);

      list.appendChild(li);

    });

    box.innerHTML = "";

    box.appendChild(list);

  }


  /* =========================================
     STOCK IN
     ========================================= */

  async function stockIn() {

    await changeStock("IN");

  }


  /* =========================================
     STOCK OUT
     ========================================= */

  async function stockOut() {

    await changeStock("OUT");

  }


  /* =========================================
     CHANGE STOCK
     ========================================= */

  async function changeStock(type) {

    const productId =
      document.getElementById("product").value;

    const quantity =
      Number(
        document.getElementById("quantity").value
      );

    if (!productId) {

      showStatus(
        "Please select a product.",
        "error"
      );

      return;
    }

    if (!quantity || quantity <= 0) {

      showStatus(
        "Please enter a valid quantity.",
        "error"
      );

      return;
    }

    const product =
      products.find(
        p => String(p.id) === String(productId)
      );

    if (!product) {

      showStatus(
        "Product not found.",
        "error"
      );

      return;
    }

    const currentStock =
      Number(product.qty || 0);

    let newStock;


    /* STOCK OUT */

    if (type === "OUT") {

      if (quantity > currentStock) {

        showStatus(
          "Not enough stock. Current stock: " +
          currentStock,
          "error"
        );

        return;
      }

      newStock =
        currentStock - quantity;

    }


    /* STOCK IN */

    else {

      newStock =
        currentStock + quantity;

    }


    /* UPDATE PRODUCT */

    const { error: updateError } =
      await db
        .from("products")
        .update({
          qty: newStock
        })
        .eq("id", product.id);


    if (updateError) {

      console.error(updateError);

      showStatus(
        "Could not update stock: " +
        updateError.message,
        "error"
      );

      return;
    }


    /* SAVE TRANSACTION */

    const { error: transactionError } =
      await db
        .from("stock_transactions")
        .insert({

          product_id: product.id,

          product_name: product.name,

          transaction_type: type,

          quantity: quantity,

          stock_after: newStock

        });


    if (transactionError) {

      console.error(transactionError);

      showStatus(
        "Stock changed, but transaction history could not be saved: " +
        transactionError.message,
        "error"
      );

    } else {

      showStatus(
        type === "IN"
          ? "Stock added successfully."
          : "Stock removed successfully.",
        "success"
      );

    }


    document.getElementById("quantity").value = "";

    await loadEverything();

  }


  /* =========================================
     LOAD TRANSACTIONS
     ========================================= */

  async function loadTransactions() {

    const { data, error } =
      await db
        .from("stock_transactions")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      return;
    }

    const transactions =
      data || [];


    let totalIn = 0;

    let totalOut = 0;


    transactions.forEach(transaction => {

      const qty =
        Number(transaction.quantity || 0);

      if (
        String(transaction.transaction_type)
          .toUpperCase() === "IN"
      ) {

        totalIn += qty;

      } else if (
        String(transaction.transaction_type)
          .toUpperCase() === "OUT"
      ) {

        totalOut += qty;

      }

    });


    document.getElementById("totalIn")
      .textContent = totalIn;

    document.getElementById("totalOut")
      .textContent = totalOut;


    renderHistory(transactions);

  }


  /* =========================================
     STOCK OUT HISTORY
     ========================================= */

  function renderHistory(transactions) {

    const table =
      document.getElementById("historyTable");

    table.innerHTML = "";


    const stockOut =
      transactions.filter(transaction =>
        String(transaction.transaction_type)
          .toUpperCase() === "OUT"
      );


    if (stockOut.length === 0) {

      table.innerHTML =
        '<tr><td colspan="4" class="empty">No stock out history</td></tr>';

      return;
    }


    stockOut.forEach(transaction => {

      const row =
        document.createElement("tr");


      const date =
        transaction.created_at
          ? new Date(
              transaction.created_at
            ).toLocaleString()
          : "";


      row.innerHTML = `

        <td>${escapeHtml(date)}</td>

        <td>${escapeHtml(
          transaction.product_name || ""
        )}</td>

        <td>
          <span class="badge badge-out">
            -${Number(transaction.quantity || 0)}
          </span>
        </td>

        <td>
          ${Number(transaction.stock_after || 0)}
        </td>

      `;


      table.appendChild(row);

    });

  }


  /* =========================================
     SECURITY / HTML ESCAPE
     ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================
     START APP
     ========================================= */

  loadEverything();


  /* =========================================
     SERVICE WORKER
     ========================================= */

  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

      navigator.serviceWorker
        .register("sw.js")
        .catch(error => {
          console.log(
            "Service worker error:",
            error
          );
        });

    });

  }

</script>

</body>
      </html>
