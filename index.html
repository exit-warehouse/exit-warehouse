<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exit Warehouse</title>

  <meta name="theme-color" content="#111111">
  <meta name="description" content="Exit Warehouse">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 15px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .welcome p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      border: none;
    }

    .button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Exit Warehouse</h1>
  </header>

  <main>
    <div class="welcome">
      <h2>Welcome to Exit Warehouse</h2>

      <p>
        Your website is working successfully.
      </p>

      <p>
        This website is also prepared to work as a Progressive Web App (PWA).
      </p>

      <button class="button" onclick="showMessage()">
        Get Started
      </button>

      <p id="message"></p>
    </div>
  </main>

  <footer>
    © 2026 Exit Warehouse
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Welcome! Your Exit Warehouse website is working.";
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js")
          .then(function () {
            console.log("Service Worker registered successfully.");
          })
          .catch(function (error) {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
