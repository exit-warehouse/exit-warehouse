<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="EXIT Warehouse Inventory Management System">
<link rel="manifest" href="manifest.json">

<title>EXIT Warehouse</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  color: #111827;
}

header {
  background: #111111;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
}

header p {
  margin: 8px 0 0;
  font-size: 18px;
  color: #cccccc;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.status {
  background: #e8f5e9;
  color: #176b2c;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  text-align: center;
  font-weight: 600;
}

.status.error {
  background: #ffe5e5;
  color: #a00000;
}

/* DASHBOARD */

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 4px 14px rgba(0,0,0,.08);
  border-left: 7px solid #2563eb;
}

.stat.in {
  border-left-color: #00a63c;
}

.stat.out {
  border-left-color: #ef1111;
}

.stat.low {
  border-left-color: #f59e0b;
}

.stat .icon {
  font-size: 25px;
}

.stat .title {
  font-size: 18px;
  color: #666;
  margin-top: 5px;
}

.stat .number {
  font-size: 38px;
  font-weight: 800;
  margin-top: 5px;
}

/* CARDS */

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 4px 14px rgba(0,0,0,.08);
}

.card h2 {
  margin-top: 0;
  font-size: 27px;
}

/* STOCK MOVEMENT */

label {
  display: block;
  font-size: 18px;
  font-weight: 700;
  margin: 14px 0 8px;
}

select,
input {
  width: 100%;
  padding: 16px;
  border: 1px solid #d0d0d0;
  border-radius: 12px;
  font-size: 18px;
  background: white;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 17px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.stock-in {
  background: #00a63c;
  color: white;
}

.stock-out {
  background: #ef1111;
  color: white;
}

button:disabled {
  opacity: .55;
}

/* LOW STOCK */

.low-box {
  border-left: 7px solid #f59e0b;
}

.low-item {
  padding: 13px;
  margin-top: 10px;
  background: #fff8e1;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 17px;
}

.no-low {
  text-align: center;
  color: #555;
  padding: 18px;
  font-size: 18px;
}

/* TABLE */

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th {
  background: #f5f6f8;
  text-align: left;
  padding: 15px;
  font-size: 17px;
}

td {
  padding: 15px;
  border-top: 1px solid #e5e5e5;
  font-size: 16px;
}

.ok {
  background: #d9fbe5;
  color: #087f23;
  padding: 7px 14px;
  border-radius: 20px;
  font-weight: 700;
  display: inline-block;
}

.low {
  background: #ffe0e0;
  color: #b00020;
  padding: 7px 14px;
  border-radius: 20px;
  font-weight: 700;
  display: inline-block;
}

/* HISTORY */

.history-item {
  border-top: 1px solid #e5e5e5;
  padding: 15px 0;
}

.history-item:first-child {
  border-top: none;
}

.history-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.history-product {
  font-size: 18px;
  font-weight: 700;
}

.history-in {
  color: #087f23;
  font-weight: 800;
}

.history-out {
  color: #b00020;
  font-weight: 800;
}

.history-details {
  color: #666;
  margin-top: 6px;
  line-height: 1.5;
}

.empty {
  text-align: center;
  color: #777;
  padding: 20px;
}

/* REFRESH */

.refresh {
  width: 100%;
  background: #111;
  color: white;
  margin-top: 5px;
}

/* MOBILE */

@media (max-width: 600px) {

  header h1 {
    font-size: 28px;
  }

  header p {
    font-size: 16px;
  }

  .container {
    padding: 14px;
  }

  .stats {
    gap: 10px;
  }

  .stat {
    padding: 16px 12px;
  }

  .stat .number {
    font-size: 30px;
  }

  .stat .title {
    font-size: 15px;
  }

  .card {
    padding: 17px;
  }

  .card h2 {
    font-size: 23px;
  }

  .buttons {
    gap: 8px;
  }

  button {
    padding: 15px 8px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>EXIT Warehouse</h1>
  <p>Inventory Management System</p>
</header>

<div class="container">

  <div id="status" class="status">
    Connecting to Supabase...
  </div>

  <!-- DASHBOARD -->

  <div class="stats">

    <div class="stat">
      <div class="icon">📦</div>
      <div class="title">Total Stock</div>
      <div class="number" id="totalStock">0</div>
    </div>

    <div class="stat in">
      <div class="icon">🟢</div>
      <div class="title">Stock In</div>
      <div class="number" id="totalIn">0</div>
    </div>

    <div class="stat out">
      <div class="icon">🔴</div>
      <div class="title">Stock Out</div>
      <div class="number" id="totalOut">0</div>
    </div>

    <div class="stat low">
      <div class="icon">⚠️</div>
      <div class="title">Low Stock</div>
      <div class="number" id="lowStockCount">0</div>
    </div>

  </div>

  <!-- STOCK MOVEMENT -->

  <div class="card">

    <h2>Stock Movement</h2>

    <label for="productSelect">Product</label>

    <select id="productSelect">
      <option value="">Select product</option>
    </select>

    <label for="quantityInput">Quantity</label>

    <input
      id="quantityInput"
      type="number"
      min="0.01"
      step="0.01"
      placeholder="Enter quantity"
    >

    <div class="buttons">

      <button
        id="stockInButton"
        class="stock-in"
        onclick="makeMovement('in')">
        ➕ Stock In
      </button>

      <button
        id="stockOutButton"
        class="stock-out"
        onclick="makeMovement('out')">
        ➖ Stock Out
      </button>

    </div>

  </div>

  <!-- LOW STOCK -->

  <div class="card low-box">

    <h2>⚠️ Low Stock Alert</h2>

    <div id="lowStockList">
      <div class="no-low">
        Loading...
      </div>
    </div>

  </div>

  <!-- CURRENT STOCK -->

  <div class="card">

    <h2>📦 Current Stock</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Product</th>
            <th>Code</th>
            <th>Unit</th>
            <th>Stock</th>
            <th>Minimum</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="productsTable">
        </tbody>

      </table>

    </div>

  </div>

  <!-- STOCK OUT HISTORY -->

  <div class="card">

    <h2>📜 Stock Out History</h2>

    <div id="history">
      <div class="empty">
        Loading history...
      </div>
    </div>

  </div>

  <button class="refresh" onclick="loadAll()">
    🔄 Refresh Data
  </button>

</div>

<footer>
  © 2026 EXIT Warehouse
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
  "https://ctucsrwfqlbscbfkmxyh.supabase.co";

/*
 IMPORTANT:
 Replace the text below with your existing
 Supabase Publishable Key.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_OE0S0YBMDtb1HZ9NHQCudw_ZE1X74e4";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   DATA
   ========================================================= */

let products = [];
let transactions = [];


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, error = false) {

  const el = document.getElementById("status");

  el.textContent = message;

  el.className = error
    ? "status error"
    : "status";
}


/* =========================================================
   LOAD EVERYTHING
   ========================================================= */

async function loadAll() {

  setStatus("Loading inventory...");

  await loadProducts();
  await loadTransactions();

  updateDashboard();
  displayProducts();
  displayLowStock();
  displayHistory();

  setStatus("Connected to Supabase ✓");
}


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts() {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: true });

  if (error) {

    console.error(error);

    setStatus(
      "Could not load products: " + error.message,
      true
    );

    return;
  }

  products = data || [];

  populateProductSelect();
}


/* =========================================================
   LOAD TRANSACTIONS
   ========================================================= */

async function loadTransactions() {

  const { data, error } =
    await supabaseClient
      .from("stock_transactions")
      .select("*")
      .order("created_at", {
        ascending: false
      })
      .limit(200);

  if (error) {

    console.error(error);

    setStatus(
      "Could not load transactions: " + error.message,
      true
    );

    transactions = [];

    return;
  }

  transactions = data || [];
}


/* =========================================================
   PRODUCT SELECT
   ========================================================= */

function populateProductSelect() {

  const select =
    document.getElementById("productSelect");

  const currentValue = select.value;

  select.innerHTML =
    '<option value="">Select product</option>';

  products.forEach(product => {

    const option =
      document.createElement("option");

    option.value = product.id;

    option.textContent =
      `${product.name} — Stock: ${Number(product.qty || 0)}`;

    select.appendChild(option);

  });

  if (
    currentValue &&
    products.some(p => String(p.id) === String(currentValue))
  ) {
    select.value = currentValue;
  }
}


/* =========================================================
   STOCK MOVEMENT
   ========================================================= */

async function makeMovement(type) {

  const productId =
    document.getElementById("productSelect").value;

  const quantity =
    Number(
      document.getElementById("quantityInput").value
    );

  if (!productId) {

    alert("Please select a product.");

    return;
  }

  if (!Number.isFinite(quantity) || quantity <= 0) {

    alert("Please enter a valid quantity.");

    return;
  }

  const product =
    products.find(
      p => String(p.id) === String(productId)
    );

  if (!product) {

    alert("Product not found.");

    return;
  }

  const currentStock =
    Number(product.qty || 0);

  if (
    type === "out" &&
    quantity > currentStock
  ) {

    alert(
      `Not enough stock.\n\nCurrent stock: ${currentStock}`
    );

    return;
  }


  /* Disable buttons */

  const inButton =
    document.getElementById("stockInButton");

  const outButton =
    document.getElementById("stockOutButton");

  inButton.disabled = true;
  outButton.disabled = true;

  setStatus(
    type === "in"
      ? "Adding stock..."
      : "Removing stock..."
  );


  try {

    /*
      IMPORTANT:

      record_stock_movement() changes products.qty.

      We do NOT update products.qty directly here.
      This prevents the double-stock problem.
    */

    const { data, error } =
      await supabaseClient.rpc(
        "record_stock_movement",
        {
          p_product_id: Number(productId),
          p_type: type,
          p_qty: quantity,
          p_note: "",
          p_worker: ""
        }
      );


    if (error) {

      console.error(error);

      alert(
        "Stock movement failed:\n\n" +
        error.message
      );

      setStatus(
        "Stock movement failed",
        true
      );

      return;
    }


    /*
      The function returns the updated product.
    */

    const updatedProduct =
      Array.isArray(data)
        ? data[0]
        : data;


    const newStock =
      Number(
        updatedProduct?.qty ??
        (
          type === "in"
            ? currentStock + quantity
            : currentStock - quantity
        )
      );


    /*
      Save transaction history.

      The database trigger now ONLY records stock_after.
      It does not change the stock again.
    */

    const transactionType =
      type === "in"
        ? "IN"
        : "OUT";


    const { error: transactionError } =
      await supabaseClient
        .from("stock_transactions")
        .insert({
          product_id: Number(productId),
          product_name: product.name,
          transaction_type: transactionType,
          quantity: Math.round(quantity),
          stock_after: Math.round(newStock)
        });


    if (transactionError) {

      console.error(transactionError);

      alert(
        "Stock changed successfully, but transaction history could not be saved:\n\n" +
        transactionError.message
      );

    } else {

      alert(
        type === "in"
          ? `Stock In successful!\n\n${product.name}\n+${quantity}\nNew stock: ${newStock}`
          : `Stock Out successful!\n\n${product.name}\n-${quantity}\nNew stock: ${newStock}`
      );

    }


    /*
      Clear quantity.
    */

    document.getElementById(
      "quantityInput"
    ).value = "";


    /*
      Reload everything from Supabase.
    */

    await loadAll();

  }

  catch (error) {

    console.error(error);

    alert(
      "Unexpected error:\n\n" +
      error.message
    );

    setStatus(
      "Unexpected error",
      true
    );

  }

  finally {

    inButton.disabled = false;
    outButton.disabled = false;

  }
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function updateDashboard() {

  /*
    Total current stock across all products.
  */

  const totalStock =
    products.reduce(
      (sum, product) =>
        sum + Number(product.qty || 0),
      0
    );


  /*
    Total IN transactions.
  */

  const totalIn =
    transactions
      .filter(
        t =>
          String(t.transaction_type)
            .toUpperCase() === "IN"
      )
      .reduce(
        (sum, t) =>
          sum + Number(t.quantity || 0),
        0
      );


  /*
    Total OUT transactions.
  */

  const totalOut =
    transactions
      .filter(
        t =>
          String(t.transaction_type)
            .toUpperCase() === "OUT"
      )
      .reduce(
        (sum, t) =>
          sum + Number(t.quantity || 0),
        0
      );


  /*
    Low stock means stock <= minimum.
  */

  const lowStock =
    products.filter(
      product =>
        Number(product.qty || 0) <=
        Number(product.min || 0)
    );


  document.getElementById(
    "totalStock"
  ).textContent =
    formatNumber(totalStock);


  document.getElementById(
    "totalIn"
  ).textContent =
    formatNumber(totalIn);


  document.getElementById(
    "totalOut"
  ).textContent =
    formatNumber(totalOut);


  document.getElementById(
    "lowStockCount"
  ).textContent =
    lowStock.length;
}


/* =========================================================
   CURRENT STOCK TABLE
   ========================================================= */

function displayProducts() {

  const table =
    document.getElementById("productsTable");

  if (!products.length) {

    table.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No products found.
        </td>
      </tr>
    `;

    return;
  }


  table.innerHTML =
    products.map(product => {

      const qty =
        Number(product.qty || 0);

      const minimum =
        Number(product.min || 0);

      const isLow =
        qty <= minimum;


      return `
        <tr>

          <td>
            <strong>
              ${escapeHtml(product.name || "")}
            </strong>
          </td>

          <td>
            ${escapeHtml(product.code || "-")}
          </td>

          <td>
            ${escapeHtml(product.unit || "")}
          </td>

          <td>
            <strong>
              ${formatNumber(qty)}
            </strong>
          </td>

          <td>
            ${formatNumber(minimum)}
          </td>

          <td>
            ${
              isLow
                ? '<span class="low">LOW</span>'
                : '<span class="ok">OK</span>'
            }
          </td>

        </tr>
      `;

    }).join("");
}


/* =========================================================
   LOW STOCK ALERT
   ========================================================= */

function displayLowStock() {

  const container =
    document.getElementById("lowStockList");


  const lowProducts =
    products.filter(
      product =>
        Number(product.qty || 0) <=
        Number(product.min || 0)
    );


  if (!lowProducts.length) {

    container.innerHTML = `
      <div class="no-low">
        ✅ No low-stock products
      </div>
    `;

    return;
  }


  container.innerHTML =
    lowProducts.map(product => {

      const qty =
        Number(product.qty || 0);

      const minimum =
        Number(product.min || 0);


      return `
        <div class="low-item">

          <strong>
            ⚠️ ${escapeHtml(product.name)}
          </strong>

          <span>
            Stock: ${formatNumber(qty)}
            /
            Minimum: ${formatNumber(minimum)}
          </span>

        </div>
      `;

    }).join("");
}


/* =========================================================
   STOCK OUT HISTORY
   ========================================================= */

function displayHistory() {

  const container =
    document.getElementById("history");


  const stockOut =
    transactions.filter(
      t =>
        String(t.transaction_type)
          .toUpperCase() === "OUT"
    );


  if (!stockOut.length) {

    container.innerHTML = `
      <div class="empty">
        No stock-out history yet.
      </div>
    `;

    return;
  }


  container.innerHTML =
    stockOut.map(transaction => {

      const date =
        transaction.created_at
          ? new Date(
              transaction.created_at
            ).toLocaleString()
          : "";


      return `
        <div class="history-item">

          <div class="history-top">

            <div class="history-product">
              ${escapeHtml(
                transaction.product_name || "Unknown"
              )}
            </div>

            <div class="history-out">
              -${formatNumber(
                transaction.quantity
              )}
            </div>

          </div>

          <div class="history-details">

            Stock after:
            <strong>
              ${formatNumber(
                transaction.stock_after
              )}
            </strong>

            <br>

            ${escapeHtml(date)}

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================================
   NUMBER FORMAT
   ========================================================= */

function formatNumber(value) {

  const number =
    Number(value || 0);

  return Number.isInteger(number)
    ? number.toLocaleString()
    : number.toLocaleString(
        undefined,
        {
          maximumFractionDigits: 2
        }
      );
}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
